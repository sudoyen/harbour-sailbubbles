[package]
name = "sailbubbles-daemon"
version = "0.2.1"
edition = "2021"

[dependencies]
rustpush = { path = "../rustpush", default-features = false, features = ["remote-anisette-v3"] }
keystore = { path = "../rustpush/keystore" }
omnisette = { path = "../rustpush/third_party/apple-private-apis/omnisette" }
reqwest = { version = "=0.11.27", default-features = false, features = ["json"] }
tokio = { version = "=1.54.0", features = ["full"] }
anyhow = "=1.0.98"
log = "=0.4.33"
env_logger = "=0.11.11"
plist = "=1.7.1"
serde = { version = "=1.0.228", features = ["derive"] }
sha2 = "=0.10.9"
rusqlite = "=0.40.2"
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }

[patch.crates-io]
quinn = { path = "../rustpush/third_party/quinn/quinn" }

[dev-dependencies]
zbus = { version = "=5.19.0", default-features = false, features = ["tokio", "p2p"] }
